<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>duongph1 tool</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9fafb;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100dvh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 { color: #FF6C47; margin-bottom: 5px; font-size: 28px; text-align: center; }
        p.subtitle { color: #666; margin-bottom: 15px; text-align: center; font-size: 14px; }
        
        .container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 15px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .split-view {
            display: flex;
            flex: 1;
            gap: 15px;
            overflow: hidden;
            flex-direction: row;
        }

        .lang-box {
            flex: 1;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 2px solid transparent;
        }

        .lang-box.vi { border-color: #3b82f6; }
        .lang-box.zh { border-color: #ef4444; }

        .box-header {
            padding: 10px 15px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .lang-box.vi .box-header { background: #3b82f6; }
        .lang-box.zh .box-header { background: #ef4444; }

        .box-content {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            font-size: 20px;
            line-height: 1.5;
            color: #1f2937;
        }

        .speaker-color-1 { color: #1f2937; }
        .speaker-color-2 { color: #047857; }
        .speaker-color-3 { color: #6d28d9; }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: white;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 1000px;
            flex-shrink: 0;
        }

        .record-btn {
            background-color: #FF6C47;
            color: white;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 108, 71, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .record-btn.recording {
            background-color: #ef4444;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
            animation: pulse 1.5s infinite;
        }
        .record-btn svg { width: 28px; height: 28px; fill: currentColor; }

        .google-btn {
            background-color: #10b981;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex: 1;
            min-width: 140px;
        }
        .google-btn.recording {
            background-color: #ef4444;
            animation: pulse 1.5s infinite;
        }

        #googleControls {
            display: flex;
            gap: 15px;
            width: 100%;
            flex-wrap: wrap;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .status { margin-top: 10px; font-weight: bold; color: #888; font-size: 14px; text-align: center; }
        .hidden { display: none !important; }

        @media (max-width: 768px) {
            body { padding: 10px; }
            h1 { font-size: 24px; margin-bottom: 2px; }
            p.subtitle { margin-bottom: 10px; font-size: 13px; }
            .split-view { flex-direction: column; gap: 10px; }
            .box-content { font-size: 16px; padding: 10px; }
            .box-header { padding: 8px 12px; font-size: 15px; }
            .controls { padding: 10px; }
            .record-btn { width: 55px; height: 55px; }
            .google-btn { font-size: 14px; padding: 10px 15px; }
        }
    </style>
</head>
<body>

    <h1>duongph1 tool</h1>
    <p class="subtitle">Dịch thuật Real-time 2 chiều (Việt ↔ Trung)</p>

    <div class="container">
        <div class="split-view">
            <div class="lang-box vi">
                <div class="box-header">🇻🇳 Tiếng Việt</div>
                <div class="box-content" id="vi-content">
                    <span style="color: #aaa; font-size: 18px;">Văn bản tiếng Việt sẽ hiển thị ở đây...</span>
                </div>
            </div>
            
            <div class="lang-box zh">
                <div class="box-header">🇨🇳 Tiếng Trung (中文)</div>
                <div class="box-content" id="zh-content">
                    <span style="color: #aaa; font-size: 18px;">中文文本将显示在这里...</span>
                </div>
            </div>
        </div>
    </div>

    <div class="controls">
        <div style="margin-bottom: 15px; width: 100%; text-align: center; display: flex; flex-wrap: wrap; justify-content: center; gap: 15px;">
            <div>
                <label for="providerSelect" style="font-weight: bold; margin-right: 10px; color: #555;">Nền tảng:</label>
                <select id="providerSelect" style="padding: 8px 15px; border-radius: 8px; border: 1px solid #ddd; outline: none; font-size: 16px; font-weight: bold;">
                    <option value="soniox">Soniox API (Cần nạp tiền)</option>
                    <option value="google" selected>Google Free (Trình duyệt)</option>
                </select>
            </div>
            <div id="sonioxSettings" class="hidden">
                <label for="serverRegion" style="font-weight: bold; margin-right: 10px; color: #555;">Server:</label>
                <select id="serverRegion" style="padding: 8px 15px; border-radius: 8px; border: 1px solid #ddd; outline: none; font-size: 16px;">
                    <option value="wss://stt-rt.soniox.com/transcribe-websocket">🇺🇸 US</option>
                    <option value="wss://stt-rt.jp.soniox.com/transcribe-websocket">🇯🇵 Japan</option>
                    <option value="wss://stt-rt.in.soniox.com/transcribe-websocket">🇮🇳 India</option>
                </select>
            </div>
        </div>

        <!-- Soniox Controls -->
        <div id="sonioxControls" class="hidden" style="display: flex; gap: 20px;">
            <button class="record-btn" id="recordBtn" title="Dùng Mic thực (Cần API Key)">
                <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
            </button>
            <button class="record-btn" id="simulateBtn" style="background-color: #3b82f6;" title="Giả lập API để Test UI">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
        </div>

        <!-- Google Controls -->
        <div id="googleControls">
            <button class="google-btn" id="googleViBtn">
                🎤 Nói Tiếng Việt
            </button>
            <button class="google-btn" id="googleZhBtn" style="background-color: #f59e0b;">
                🎤 说中文 (Nói T.Trung)
            </button>
        </div>

        <div class="status" id="status">Ready</div>
    </div>

    <script>
        // DOM Elements
        const providerSelect = document.getElementById('providerSelect');
        const sonioxSettings = document.getElementById('sonioxSettings');
        const sonioxControls = document.getElementById('sonioxControls');
        const googleControls = document.getElementById('googleControls');
        const viContent = document.getElementById('vi-content');
        const zhContent = document.getElementById('zh-content');
        const statusDiv = document.getElementById('status');

        providerSelect.addEventListener('change', (e) => {
            if (e.target.value === 'soniox') {
                sonioxSettings.classList.remove('hidden');
                sonioxControls.classList.remove('hidden');
                googleControls.classList.add('hidden');
                statusDiv.innerText = "Ready (Soniox API)";
            } else {
                sonioxSettings.classList.add('hidden');
                sonioxControls.classList.add('hidden');
                googleControls.classList.remove('hidden');
                statusDiv.innerText = "Ready (Google Free API)";
            }
            if (isRecording) stopRecording();
            if (googleRecognition) googleRecognition.stop();
        });

        // -----------------------------------------------------------------
        // GOOGLE FREE IMPLEMENTATION
        // -----------------------------------------------------------------
        let googleRecognition = null;
        let isGoogleRecording = false;
        let googleLang = ''; 
        let globalGoogleConversations = []; // { id, viFinal, zhFinal, viInterim, zhInterim }
        let googleConversationId = 0;

        function initGoogleSpeech() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("Trình duyệt của bạn không hỗ trợ Web Speech API. Vui lòng dùng Google Chrome.");
                return null;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onstart = () => {
                isGoogleRecording = true;
                statusDiv.innerText = `Đang nghe (${googleLang === 'vi-VN' ? 'Tiếng Việt' : 'Tiếng Trung'})...`;
                statusDiv.style.color = "#ef4444";
            };

            recognition.onresult = async (event) => {
                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                // Cập nhật giao diện ngay lập tức cho phần chữ tạm (interim)
                if (googleLang === 'vi-VN') {
                    updateGoogleUI(googleConversationId, finalTranscript, "", interimTranscript, "");
                } else {
                    updateGoogleUI(googleConversationId, "", finalTranscript, "", interimTranscript);
                }

                // Nếu có câu chốt (final), gọi API Google Translate miễn phí
                if (finalTranscript.trim() !== '') {
                    const textToTranslate = finalTranscript.trim();
                    const sourceLang = googleLang === 'vi-VN' ? 'vi' : 'zh-CN';
                    const targetLang = googleLang === 'vi-VN' ? 'zh-CN' : 'vi';
                    
                    try {
                        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(textToTranslate)}`);
                        const data = await res.json();
                        let translatedText = '';
                        data[0].forEach(item => { translatedText += item[0]; });

                        if (googleLang === 'vi-VN') {
                            updateGoogleUI(googleConversationId, finalTranscript, translatedText, "", "");
                        } else {
                            updateGoogleUI(googleConversationId, translatedText, finalTranscript, "", "");
                        }
                    } catch (err) {
                        console.error("Lỗi dịch:", err);
                    }
                }
            };

            recognition.onerror = (event) => {
                console.error("Lỗi Google Speech:", event.error);
                stopGoogleRecording();
            };

            recognition.onend = () => {
                if (isGoogleRecording) {
                    try {
                        recognition.start();
                    } catch (e) {
                        stopGoogleRecording();
                    }
                } else {
                    stopGoogleRecording();
                }
            };

            return recognition;
        }

        function updateGoogleUI(id, viFinal, zhFinal, viInterim, zhInterim) {
            let conv = globalGoogleConversations.find(c => c.id === id);
            if (!conv) {
                conv = { id, viFinal: "", zhFinal: "", viInterim: "", zhInterim: "" };
                globalGoogleConversations.push(conv);
            }
            if (viFinal) conv.viFinal += (conv.viFinal ? " " : "") + viFinal;
            if (zhFinal) conv.zhFinal += (conv.zhFinal ? " " : "") + zhFinal;
            conv.viInterim = viInterim;
            conv.zhInterim = zhInterim;

            renderGoogleUI();
        }

        function renderGoogleUI() {
            let viHTML = "";
            let zhHTML = "";
            globalGoogleConversations.forEach(c => {
                let fullVi = c.viFinal + (c.viInterim ? " " + c.viInterim : "");
                let fullZh = c.zhFinal + (c.zhInterim ? " " + c.zhInterim : "");
                if (fullVi.trim() !== "") viHTML += `<p class="speaker-color-1">${fullVi}</p>`;
                if (fullZh.trim() !== "") zhHTML += `<p class="speaker-color-1">${fullZh}</p>`;
            });
            if (viHTML !== "") {
                viContent.innerHTML = viHTML;
                viContent.scrollTop = viContent.scrollHeight;
            }
            if (zhHTML !== "") {
                zhContent.innerHTML = zhHTML;
                zhContent.scrollTop = zhContent.scrollHeight;
            }
        }

        function stopGoogleRecording() {
            isGoogleRecording = false;
            if (googleRecognition) {
                googleRecognition.stop();
            }
            document.getElementById('googleViBtn').classList.remove('recording');
            document.getElementById('googleZhBtn').classList.remove('recording');
            statusDiv.innerText = "Ready (Google Free API)";
            statusDiv.style.color = "#888";
        }

        document.getElementById('googleViBtn').addEventListener('click', () => {
            if (isGoogleRecording) {
                stopGoogleRecording();
                return;
            }
            viContent.innerHTML = "";
            zhContent.innerHTML = "";
            globalGoogleConversations = [];
            googleConversationId++;
            googleLang = 'vi-VN';
            googleRecognition = initGoogleSpeech();
            if (googleRecognition) {
                googleRecognition.lang = googleLang;
                googleRecognition.start();
                document.getElementById('googleViBtn').classList.add('recording');
            }
        });

        document.getElementById('googleZhBtn').addEventListener('click', () => {
            if (isGoogleRecording) {
                stopGoogleRecording();
                return;
            }
            viContent.innerHTML = "";
            zhContent.innerHTML = "";
            globalGoogleConversations = [];
            googleConversationId++;
            googleLang = 'zh-CN';
            googleRecognition = initGoogleSpeech();
            if (googleRecognition) {
                googleRecognition.lang = googleLang;
                googleRecognition.start();
                document.getElementById('googleZhBtn').classList.add('recording');
            }
        });

        // -----------------------------------------------------------------
        // SONIOX IMPLEMENTATION
        // -----------------------------------------------------------------
        const apiKey = "snx_proj_AdKkf8QwONzJ8KSFe4TpKoogTQPRHQKOGSDIEZwPX-V1.NAphCZejL5ZS2-tjsKDPznsKZdAWLcwBwbFSGywvEpHEpCmrDpu91B7xfiZbazGX0KPP7SgnGHIxoH8zxzQ7DA.swtJ5Q";
        let ws = null;
        let audioContext = null;
        let mediaStream = null;
        let processor = null;
        let isRecording = false;

        const recordBtn = document.getElementById('recordBtn');
        const serverRegionSelect = document.getElementById('serverRegion');
        let speakerSessions = {};

        recordBtn.addEventListener('click', async () => {
            if (isRecording) {
                stopRecording();
            } else {
                await startRecording();
            }
        });

        function renderSplitView() {
            let viHTML = "";
            let zhHTML = "";
            let keys = Object.keys(speakerSessions).sort((a,b) => parseInt(a) - parseInt(b));
            keys.forEach(speakerId => {
                let session = speakerSessions[speakerId];
                let orig = session.originalFinal.join('') + session.originalNonFinal.join('');
                let trans = session.translatedFinal.join('') + session.translatedNonFinal.join('');
                if (orig.trim() !== "" || trans.trim() !== "") {
                    let isOrigChinese = /[\u3400-\u9FBF]/.test(orig);
                    let viText = isOrigChinese ? trans : orig;
                    let zhText = isOrigChinese ? orig : trans;
                    if (viText) viHTML += `<p class="speaker-color-${speakerId}">${viText}</p>`;
                    if (zhText) zhHTML += `<p class="speaker-color-${speakerId}">${zhText}</p>`;
                }
            });
            if (viHTML !== "") { viContent.innerHTML = viHTML; viContent.scrollTop = viContent.scrollHeight; }
            if (zhHTML !== "") { zhContent.innerHTML = zhHTML; zhContent.scrollTop = zhContent.scrollHeight; }
        }

        async function startRecording() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                const source = audioContext.createMediaStreamSource(mediaStream);
                processor = audioContext.createScriptProcessor(4096, 1, 1);
                
                const wsUrl = serverRegionSelect.value;
                ws = new WebSocket(wsUrl);
                
                ws.onopen = () => {
                    ws.send(JSON.stringify({
                        api_key: apiKey,
                        model: "stt-rt-v5",
                        audio_format: "s16le",
                        sample_rate_hertz: 16000,
                        num_audio_channels: 1,
                        enable_endpoint_detection: true,
                        enable_speaker_diarization: true,
                        translation: {
                            type: "two_way",
                            language_a: "vi",
                            language_b: "zh"
                        }
                    }));
                    statusDiv.innerText = "Listening (Việt ↔ Trung)...";
                    statusDiv.style.color = "#ef4444";
                    recordBtn.classList.add('recording');
                    isRecording = true;
                    viContent.innerHTML = "";
                    zhContent.innerHTML = "";
                    speakerSessions = {};
                };

                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    if (data.tokens) {
                        Object.keys(speakerSessions).forEach(id => {
                            speakerSessions[id].originalNonFinal = [];
                            speakerSessions[id].translatedNonFinal = [];
                        });
                        data.tokens.forEach(t => {
                            let speakerId = t.speaker || '1';
                            let isTrans = t.translation_status === 'translation';
                            if (!speakerSessions[speakerId]) {
                                speakerSessions[speakerId] = { originalFinal: [], originalNonFinal: [], translatedFinal: [], translatedNonFinal: [] };
                            }
                            let s = speakerSessions[speakerId];
                            if (isTrans) {
                                if (t.is_final) s.translatedFinal.push(t.text);
                                else s.translatedNonFinal.push(t.text);
                            } else {
                                if (t.is_final) s.originalFinal.push(t.text);
                                else s.originalNonFinal.push(t.text);
                            }
                        });
                        renderSplitView();
                    }
                };
                ws.onclose = () => stopRecording();
                processor.onaudioprocess = (e) => {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        const inputData = e.inputBuffer.getChannelData(0);
                        const pcm16 = new Int16Array(inputData.length);
                        for (let i = 0; i < inputData.length; i++) { pcm16[i] = Math.max(-1, Math.min(1, inputData[i])) * 0x7FFF; }
                        ws.send(pcm16.buffer);
                    }
                };
                source.connect(processor);
                processor.connect(audioContext.destination);
            } catch (err) {
                alert("Error accessing microphone: " + err.message);
            }
        }

        function stopRecording() {
            if (ws) { ws.close(); ws = null; }
            if (mediaStream) { mediaStream.getTracks().forEach(track => track.stop()); mediaStream = null; }
            if (processor) { processor.disconnect(); processor = null; }
            if (audioContext) { audioContext.close(); audioContext = null; }
            statusDiv.innerText = "Ready (Soniox API)";
            statusDiv.style.color = "#888";
            recordBtn.classList.remove('recording');
            isRecording = false;
        }

        const simulateBtn = document.getElementById('simulateBtn');
        let simulateTimer = null;
        simulateBtn.addEventListener('click', () => {
            if (isRecording) stopRecording();
            viContent.innerHTML = "";
            zhContent.innerHTML = "";
            speakerSessions = {};
            statusDiv.innerText = "Đang giả lập Streaming...";
            statusDiv.style.color = "#3b82f6";
            simulateBtn.classList.add('recording');
            simulateBtn.style.backgroundColor = "#ef4444";
            isRecording = true;

            const fakeEvents = [
                [{text: "Xin ", is_final: false, speaker: "1", translation_status: "original"}],
                [{text: "Xin chào ", is_final: false, speaker: "1", translation_status: "original"}, {text: "你 ", is_final: false, speaker: "1", translation_status: "translation"}],
                [{text: "Xin chào, ", is_final: true, speaker: "1", translation_status: "original"}, {text: "你好, ", is_final: true, speaker: "1", translation_status: "translation"}],
                [{text: "tôi ", is_final: false, speaker: "1", translation_status: "original"}],
                [{text: "tôi tên là ", is_final: false, speaker: "1", translation_status: "original"}, {text: "我叫 ", is_final: false, speaker: "1", translation_status: "translation"}],
                [{text: "tôi tên là Dương.", is_final: true, speaker: "1", translation_status: "original"}, {text: "我叫 Dương。", is_final: true, speaker: "1", translation_status: "translation"}],
                [{text: "很 ", is_final: false, speaker: "2", translation_status: "original"}],
                [{text: "很高兴 ", is_final: false, speaker: "2", translation_status: "original"}, {text: "Rất ", is_final: false, speaker: "2", translation_status: "translation"}],
                [{text: "很高兴认识你", is_final: true, speaker: "2", translation_status: "original"}, {text: "Rất vui được gặp bạn", is_final: true, speaker: "2", translation_status: "translation"}],
            ];

            let delay = 0;
            fakeEvents.forEach((tokens, idx) => {
                simulateTimer = setTimeout(() => {
                    const eventData = { tokens: tokens };
                    Object.keys(speakerSessions).forEach(id => {
                        speakerSessions[id].originalNonFinal = [];
                        speakerSessions[id].translatedNonFinal = [];
                    });
                    eventData.tokens.forEach(t => {
                        let speakerId = t.speaker || '1';
                        let isTrans = t.translation_status === 'translation';
                        if (!speakerSessions[speakerId]) {
                            speakerSessions[speakerId] = { originalFinal: [], originalNonFinal: [], translatedFinal: [], translatedNonFinal: [] };
                        }
                        let s = speakerSessions[speakerId];
                        if (isTrans) {
                            if (t.is_final) s.translatedFinal.push(t.text);
                            else s.translatedNonFinal.push(t.text);
                        } else {
                            if (t.is_final) s.originalFinal.push(t.text);
                            else s.originalNonFinal.push(t.text);
                        }
                    });
                    renderSplitView();
                    if (idx === fakeEvents.length - 1) {
                        setTimeout(() => {
                            statusDiv.innerText = "Ready (Nhấn Play màu xanh để Giả lập)";
                            statusDiv.style.color = "#888";
                            simulateBtn.classList.remove('recording');
                            simulateBtn.style.backgroundColor = "#3b82f6";
                            isRecording = false;
                        }, 1000);
                    }
                }, delay += 800);
            });
        });
    </script>
</body>
</html>
